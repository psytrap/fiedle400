name: Build Standalone Installers & Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml

  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64
            asset_name: fiedle400-windows-x64.exe
          - os: linux
            runner: ubuntu-latest
            arch: x64
            asset_name: fiedle400-linux-x64.tar.gz
          - os: macos
            runner: macos-latest
            arch: arm64
            asset_name: fiedle400-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller fiedle400.spec

      - name: Rename Output Binary
        shell: bash
        run: |
          # Fixed path regardless of OS/asset_name: the smoke test below always
          # checks this raw, directly-executable binary. Packaging it into its
          # final shipped shape (plain copy for Windows/macOS, a tarball with
          # the install scripts for Linux) is a separate step further down, so
          # a change there can never skip exercising the actual executable.
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp dist/fiedle400.exe release/bin.exe
          else
            cp dist/fiedle400 release/bin
            chmod +x release/bin
          fi

      - name: Smoke Test the Built Binary
        shell: bash
        run: |
          # The binary is the artifact users actually get; building it proves
          # nothing about whether it starts. macOS has no other verification
          # (no hardware, nobody to test by hand), so this is its only gate.
          BIN="release/bin"; [ "${{ matrix.os }}" = "windows" ] && BIN="release/bin.exe"
          out=$("$BIN" --version)
          echo "built binary reports: $out"
          expected=$(python -c "import fiedle400; print(fiedle400.__version__)")
          case "$out" in
            *"$expected"*) ;;
            *) echo "version mismatch: expected $expected, got '$out'" >&2; exit 1 ;;
          esac
          "$BIN" --help > /dev/null
          "$BIN" config > /dev/null

      - name: Package Release Asset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows)
              cp release/bin.exe "release/${{ matrix.asset_name }}"
              ;;
            macos)
              cp release/bin "release/${{ matrix.asset_name }}"
              chmod +x "release/${{ matrix.asset_name }}"
              ;;
            linux)
              # One download gets the binary plus both install scripts: the
              # user-local installer and the separate, explicitly root-only
              # udev setup script (fiedle400 selftest never invokes sudo
              # itself -- it only ever names this script).
              stage="$(mktemp -d)"
              cp release/bin "$stage/fiedle400"
              cp packaging/linux/install.sh "$stage/install.sh"
              cp packaging/linux/fiedle400_setup-udev.sh "$stage/fiedle400_setup-udev.sh"
              chmod +x "$stage/fiedle400" "$stage/install.sh" "$stage/fiedle400_setup-udev.sh"
              tar -C "$stage" -czf "release/${{ matrix.asset_name }}" \
                fiedle400 install.sh fiedle400_setup-udev.sh
              rm -rf "$stage"
              ;;
          esac

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}


  installer-windows:
    name: Windows Installer
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: fiedle400-windows-x64.exe
          path: artifact

      - name: Stage Binary Where the Installer Script Expects It
        shell: bash
        run: |
          mkdir -p dist
          cp artifact/fiedle400-windows-x64.exe dist/fiedle400.exe

      - name: Read Package Version
        id: ver
        shell: bash
        run: |
          version=$(python -c "import fiedle400; print(fiedle400.__version__)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building installer for fiedle400 ${version}"

      - name: Ensure Inno Setup Is Available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Installer
        shell: pwsh
        run: |
          & "$env:ISCC" /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\fiedle400.iss

      - name: Smoke Test the Installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $setup = "installer\fiedle400-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced" }

          # /VERYSILENT needs no UAC: the script installs per-user into LOCALAPPDATA.
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

          $installed = "$env:LOCALAPPDATA\Programs\fiedle400\fiedle400.exe"
          if (-not (Test-Path $installed)) { throw "fiedle400.exe was not installed to $installed" }

          # The shortcut's WorkingDir must exist, or Explorer silently falls back.
          $datadir = [Environment]::GetFolderPath("MyDocuments") + "\PO-400"
          if (-not (Test-Path $datadir)) { throw "data folder was not created at $datadir" }

          # The installed binary must actually run, not merely exist.
          $out = & $installed --version
          Write-Host "installed binary reports: $out"
          if ($out -notmatch "${{ steps.ver.outputs.version }}") {
            throw "version mismatch: expected ${{ steps.ver.outputs.version }}, got '$out'"
          }
          & $installed --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

          # Leave the runner clean so a rerun starts from nothing.
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\fiedle400" -Filter "unins*.exe" | Select-Object -First 1
          if ($uninst) {
            Start-Process -FilePath $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: fiedle400-setup.exe
          path: installer/fiedle400-setup.exe

  release:
    name: Create GitHub Release
    needs: [build, installer-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The repo's default Actions token is read-only (confirmed via
    # `gh api repos/.../actions/permissions/workflow`), so creating a release
    # 403s without this. Scoped to just this job/permission rather than
    # flipping the repo-wide default, which would grant write to every job.
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          draft: false
          # Beta (RELEASE_PLAN.md 3f): G7 (a real finger-on-probe session,
          # plot confirmed physiologically plausible) passed -- first
          # 2026-10-15, re-confirmed repeatedly since, including a 190-record
          # real download/plot on 2026-10-16. Promoted from alpha 2026-10-16
          # (psytrap); no version bump needed for the promotion itself.
          prerelease: false
          body: |
            ### Pulsox PO-400 Standalone Executables & Installers

            **Beta release.** All automated gates pass, and a real-world
            finger-on-probe session has been recorded and visually confirmed
            (RELEASE_PLAN.md gate G7): SpO2 and heart-rate traces show real
            physiological variation, not flat-lined or implausible values.
            Promoted from alpha to beta 2026-10-16.

            **Windows SmartScreen:** these binaries are not code-signed, so Windows
            will show a "Windows protected your PC" warning. Choose *More info* →
            *Run anyway*. Verify the SHA-256 against the CI artifacts if in doubt.

            **Minimum Windows:** verified on Windows 8.1 (6.3.9600, x64) with a real
            PO-400 attached. Newer versions work; older ones are untested.

            **Device clock:** the PO-400 does not report its clock over USB (it answers
            with the same fixed bytes every time), so `read-time` shows that reply raw and
            `set-time` is unverified. Stored sessions keep their correct timestamps regardless.
            
            - **Windows (installer)**: Download `fiedle400-setup.exe` -- installs per-user, no admin rights needed.
            - **Windows (portable)**: Download `fiedle400-windows-x64.exe` (run directly from PowerShell or CMD).
            - **Linux**: Download `fiedle400-linux-x64.tar.gz`, extract it, then `./install.sh`
              (installs `fiedle400` to `~/.local/bin`). Device access needs a one-time root step:
              `sudo ./fiedle400_setup-udev.sh`. Then verify with `fiedle400 selftest`.
            - **macOS**: Download `fiedle400-macos-arm64` (Apple Silicon M1/M2/M3/M4).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

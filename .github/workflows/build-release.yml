name: Build Standalone Installers & Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml

  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64
            asset_name: po400-windows-x64.exe
          - os: linux
            runner: ubuntu-latest
            arch: x64
            asset_name: po400-linux-x64
          - os: macos
            runner: macos-latest
            arch: arm64
            asset_name: po400-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller po400.spec

      - name: Rename Output Binary
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp dist/po400.exe release/${{ matrix.asset_name }}
          else
            cp dist/po400 release/${{ matrix.asset_name }}
            chmod +x release/${{ matrix.asset_name }}
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}


  installer-windows:
    name: Windows Installer
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: po400-windows-x64.exe
          path: artifact

      - name: Stage Binary Where the Installer Script Expects It
        shell: bash
        run: |
          mkdir -p dist
          cp artifact/po400-windows-x64.exe dist/po400.exe

      - name: Read Package Version
        id: ver
        shell: bash
        run: |
          version=$(python -c "import po400; print(po400.__version__)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building installer for po400 ${version}"

      - name: Ensure Inno Setup Is Available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Installer
        shell: pwsh
        run: |
          & "$env:ISCC" /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\po400.iss

      - name: Smoke Test the Installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $setup = "installer\po400-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced" }

          # /VERYSILENT needs no UAC: the script installs per-user into LOCALAPPDATA.
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

          $installed = "$env:LOCALAPPDATA\Programs\po400\po400.exe"
          if (-not (Test-Path $installed)) { throw "po400.exe was not installed to $installed" }

          # The Start Menu shortcut launches through this; without it the entry is dead.
          $shim = "$env:LOCALAPPDATA\Programs\po400\po400-shell.cmd"
          if (-not (Test-Path $shim)) { throw "po400-shell.cmd was not installed to $shim" }

          # The shortcut's WorkingDir must exist, or Explorer silently falls back.
          $datadir = [Environment]::GetFolderPath("MyDocuments") + "\PO-400"
          if (-not (Test-Path $datadir)) { throw "data folder was not created at $datadir" }

          # The installed binary must actually run, not merely exist.
          $out = & $installed --version
          Write-Host "installed binary reports: $out"
          if ($out -notmatch "${{ steps.ver.outputs.version }}") {
            throw "version mismatch: expected ${{ steps.ver.outputs.version }}, got '$out'"
          }
          & $installed --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

          # Leave the runner clean so a rerun starts from nothing.
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\po400" -Filter "unins*.exe" | Select-Object -First 1
          if ($uninst) {
            Start-Process -FilePath $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: po400-setup.exe
          path: installer/po400-setup.exe

  release:
    name: Create GitHub Release
    needs: [build, installer-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          draft: false
          prerelease: false
          body: |
            ### Pulsox PO-400 Standalone Executables & Installers
            
            - **Windows (installer)**: Download `po400-setup.exe` -- installs per-user, no admin rights needed.
            - **Windows (portable)**: Download `po400-windows-x64.exe` (run directly from PowerShell or CMD).
            - **Linux**: Download `po400-linux-x64` (`chmod +x po400-linux-x64 && ./po400-linux-x64`).
            - **macOS**: Download `po400-macos-arm64` (Apple Silicon M1/M2/M3/M4).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Standalone Installers & Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64
            asset_name: po400-windows-x64.exe
          - os: linux
            runner: ubuntu-latest
            arch: x64
            asset_name: po400-linux-x64
          - os: macos
            runner: macos-latest
            arch: arm64
            asset_name: po400-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller po400.spec

      - name: Rename Output Binary
        shell: bash
        run: |
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp dist/po400.exe release/${{ matrix.asset_name }}
          else
            cp dist/po400 release/${{ matrix.asset_name }}
            chmod +x release/${{ matrix.asset_name }}
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          draft: false
          prerelease: false
          body: |
            ### Pulsox PO-400 Standalone Executables & Installers
            
            - **Windows**: Download `po400-windows-x64.exe` (run directly from PowerShell or CMD).
            - **Linux**: Download `po400-linux-x64` (`chmod +x po400-linux-x64 && ./po400-linux-x64`).
            - **macOS**: Download `po400-macos-arm64` (Apple Silicon M1/M2/M3/M4).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

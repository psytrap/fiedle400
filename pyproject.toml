[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fiedle400"
version = "0.4.19"
description = "CLI tool to read live data and extract recordings from Pulsox PO-400 USB HID pulse oximeter"
readme = "README.md"
authors = [
    { name = "Developer" }
]
requires-python = ">=3.11"
dependencies = [
    "hid; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "hid",
]
plot = [
    "matplotlib",
]

[project.scripts]
fiedle400 = "fiedle400.cli:main"

[tool.setuptools.packages.find]
include = ["fiedle400*"]

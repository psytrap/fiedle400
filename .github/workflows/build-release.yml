name: Build Standalone Installers & Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml

  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: windows
            runner: windows-latest
            arch: x64
            asset_name: fiedle400-windows-x64.exe
          - os: linux
            # Pinned, not ubuntu-latest (T-049): a PyInstaller binary needs at least the
            # glibc it was built against, and Ubuntu 22.04 LTS is the minimum supported Linux
            # (psytrap, 2026-11-02). Build on the oldest supported release: glibc 2.35.
            runner: ubuntu-22.04
            arch: x64
            asset_name: fiedle400-linux-x64.tar.gz
          - os: macos
            runner: macos-latest
            arch: arm64
            asset_name: fiedle400-macos-arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller hidapi

      - name: Build Standalone Binary with PyInstaller
        run: |
          pyinstaller fiedle400.spec

      - name: Rename Output Binary
        shell: bash
        run: |
          # Fixed path regardless of OS/asset_name: the smoke test below always
          # checks this raw, directly-executable binary. Packaging it into its
          # final shipped shape (plain copy for Windows/macOS, a tarball with
          # the install scripts for Linux) is a separate step further down, so
          # a change there can never skip exercising the actual executable.
          mkdir -p release
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp dist/fiedle400.exe release/bin.exe
          else
            cp dist/fiedle400 release/bin
            chmod +x release/bin
          fi

      - name: Smoke Test the Built Binary
        shell: bash
        run: |
          # The binary is the artifact users actually get; building it proves
          # nothing about whether it starts. macOS has no other verification
          # (no hardware, nobody to test by hand), so this is its only gate.
          BIN="release/bin"; [ "${{ matrix.os }}" = "windows" ] && BIN="release/bin.exe"
          out=$("$BIN" --version)
          echo "built binary reports: $out"
          expected=$(python -c "import fiedle400; print(fiedle400.__version__)")
          case "$out" in
            *"$expected"*) ;;
            *) echo "version mismatch: expected $expected, got '$out'" >&2; exit 1 ;;
          esac
          "$BIN" --help > /dev/null
          "$BIN" config > /dev/null

      - name: Package Release Asset
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows)
              cp release/bin.exe "release/${{ matrix.asset_name }}"
              ;;
            macos)
              cp release/bin "release/${{ matrix.asset_name }}"
              chmod +x "release/${{ matrix.asset_name }}"
              ;;
            linux)
              # One download gets the binary plus both install scripts: the
              # user-local installer and the separate, explicitly root-only
              # udev setup script (fiedle400 selftest never invokes sudo
              # itself -- it only ever names this script).
              stage="$(mktemp -d)"
              cp release/bin "$stage/fiedle400"
              cp packaging/linux/install.sh "$stage/install.sh"
              cp packaging/linux/fiedle400_setup-udev.sh "$stage/fiedle400_setup-udev.sh"
              chmod +x "$stage/fiedle400" "$stage/install.sh" "$stage/fiedle400_setup-udev.sh"
              tar -C "$stage" -czf "release/${{ matrix.asset_name }}" \
                fiedle400 install.sh fiedle400_setup-udev.sh
              rm -rf "$stage"
              ;;
          esac

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release/${{ matrix.asset_name }}


  quarantine-macos:
    # T-049 / RELEASE_PLAN D2: the build job's smoke test runs the binary it just built,
    # which never carries the com.apple.quarantine attribute a browser download gets.
    # This job takes the packaged asset, marks it quarantined like a download, and checks
    # that the steps the README gives a Mac user make it run.
    name: macOS Quarantine Check
    needs: build
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Download macOS Binary
        uses: actions/download-artifact@v4
        with:
          name: fiedle400-macos-arm64
          path: artifact

      - name: Mark It as Downloaded (quarantine attribute)
        run: |
          f=artifact/fiedle400-macos-arm64
          xattr -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$f"
          xattr -l "$f"

      - name: Run As Downloaded (informational)
        run: |
          # A browser download also loses the execute bit; the README covers both.
          f=artifact/fiedle400-macos-arm64
          spctl --assess --type execute -vv "$f" || true
          chmod +x "$f"
          # Gatekeeper may block (expected for an unsigned download) or the runner may
          # allow it; either is recorded, neither fails the job. Bounded so a policy
          # prompt can never hang the job.
          "$f" --version & pid=$!
          ( sleep 30; kill "$pid" 2>/dev/null ) & watchdog=$!
          if wait "$pid"; then echo "ran while quarantined"; else echo "blocked while quarantined (exit $?)"; fi
          kill "$watchdog" 2>/dev/null || true

      - name: Follow the README Steps and Run
        run: |
          f=artifact/fiedle400-macos-arm64
          chmod +x "$f"
          xattr -d com.apple.quarantine "$f"
          if xattr -p com.apple.quarantine "$f" 2>/dev/null; then
            echo "quarantine attribute still present" >&2; exit 1
          fi
          out=$("$f" --version)
          echo "binary reports: $out"
          expected=$(python3 -c "import fiedle400; print(fiedle400.__version__)")
          case "$out" in
            *"$expected"*) ;;
            *) echo "version mismatch: expected $expected, got '$out'" >&2; exit 1 ;;
          esac
          "$f" --help > /dev/null

  linux-oldest-lts:
    # T-050: the packaged Linux asset must run on the oldest supported Ubuntu (22.04 LTS,
    # psytrap 2026-11-02) in a clean system: no Python, no build tools, nothing but the image.
    name: Linux Binary on Ubuntu 22.04
    needs: build
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Download Linux Asset
        uses: actions/download-artifact@v4
        with:
          name: fiedle400-linux-x64.tar.gz
          path: artifact

      - name: Unpack and Run
        shell: bash
        run: |
          grep PRETTY_NAME /etc/os-release
          ldd --version | head -1
          mkdir unpacked
          tar -C unpacked -xzf artifact/fiedle400-linux-x64.tar.gz
          cd unpacked
          ./fiedle400 --version
          ./fiedle400 --help > /dev/null
          ./fiedle400 config > /dev/null
          echo "runs on $(grep VERSION_ID /etc/os-release)"

  installer-windows:
    name: Windows Installer
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download Windows Binary
        uses: actions/download-artifact@v4
        with:
          name: fiedle400-windows-x64.exe
          path: artifact

      - name: Stage Binary Where the Installer Script Expects It
        shell: bash
        run: |
          mkdir -p dist
          cp artifact/fiedle400-windows-x64.exe dist/fiedle400.exe

      - name: Read Package Version
        id: ver
        shell: bash
        run: |
          version=$(python -c "import fiedle400; print(fiedle400.__version__)")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building installer for fiedle400 ${version}"

      - name: Ensure Inno Setup Is Available
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          echo "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build Installer
        shell: pwsh
        run: |
          & "$env:ISCC" /DAppVersion=${{ steps.ver.outputs.version }} packaging\windows\fiedle400.iss

      - name: Upgrade Test (previous release's installer, then this one over it)
        # T-097: run the real installer over an existing install, as a user upgrading does,
        # then uninstall and check nothing is left. The fresh-install smoke test below then
        # covers the "clean uninstall, then new install" path.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $new = "${{ steps.ver.outputs.version }}"
          $app = "$env:LOCALAPPDATA\Programs\fiedle400"
          $exe = "$app\fiedle400.exe"
          $docs = [Environment]::GetFolderPath("MyDocuments") + "\fiedle400"
          $group = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\fiedle400"
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{1C4AFF42-942E-45D2-ACF1-908840BCC434}_is1"
          $ctxKeys = @("HKCU:\SOFTWARE\Classes\Directory\shell\fiedle400",
                       "HKCU:\SOFTWARE\Classes\Directory\Background\shell\fiedle400")
          $silent = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=contextmenu")

          # 1. The latest published release, installed the way a user had it.
          $prev = "$env:RUNNER_TEMP\prev-setup.exe"
          Invoke-WebRequest "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/fiedle400-setup.exe" -OutFile $prev
          Start-Process -FilePath $prev -ArgumentList $silent -Wait
          if (-not (Test-Path $exe)) { throw "previous release did not install to $exe" }
          Write-Host "previous release reports: $(& $exe --version)"

          # The user's own files must survive the upgrade: an edited demo and a recording.
          Add-Content "$docs\demo.SpO2" "user-edit-marker"
          Set-Content "$docs\my_recording.html" "keep me"
          $demoHash = (Get-FileHash "$docs\demo.SpO2").Hash

          # 2. This build over it.
          Start-Process -FilePath "installer\fiedle400-setup.exe" -ArgumentList $silent -Wait
          $out = & $exe --version
          Write-Host "after upgrade: $out"
          if ($out -notmatch [regex]::Escape($new)) { throw "upgrade left '$out', expected $new" }
          $reg = Get-ItemProperty $uninstKey
          if ($reg.DisplayVersion -ne $new) { throw "uninstall entry says $($reg.DisplayVersion), expected $new" }
          $uninstallers = @(Get-ChildItem $app -Filter "unins*.exe")
          if ($uninstallers.Count -ne 1) { throw "expected one uninstaller, found: $($uninstallers.Name -join ', ')" }
          $extra = @(Get-ChildItem $app -File | Where-Object { $_.Name -notmatch '^(fiedle400\.exe|unins\d+\.(exe|dat))$' })
          if ($extra.Count) { throw "unexpected files in ${app}: $($extra.Name -join ', ')" }
          $links = @(Get-ChildItem $group -Filter "*.lnk" | ForEach-Object Name | Sort-Object)
          if (($links -join "|") -ne "fiedle400.lnk|Uninstall fiedle400.lnk|View Demo Recording.lnk") {
            throw "Start Menu group has: $($links -join ', ')"
          }
          foreach ($k in $ctxKeys) {
            $cmd = (Get-ItemProperty "$k\command")."(default)"
            if ($cmd -ne "`"$exe`"") { throw "$k\command is '$cmd'" }
          }
          if ((Get-FileHash "$docs\demo.SpO2").Hash -ne $demoHash) { throw "upgrade overwrote the user's demo.SpO2" }
          if (-not (Test-Path "$docs\my_recording.html")) { throw "upgrade removed a user recording" }

          # 3. Uninstall. The uninstaller re-launches itself from TEMP and returns at once,
          #    so wait for the program folder to go before checking.
          Start-Process -FilePath $uninstallers[0].FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          $left = @($app, $group) + $ctxKeys + @($uninstKey) | Where-Object { Test-Path $_ }
          if ($left) { throw "left behind after uninstall: $($left -join ', ')" }
          if (-not (Test-Path "$docs\my_recording.html")) { throw "uninstall removed a user recording" }
          if (-not (Test-Path "$docs\demo.SpO2")) { throw "uninstall removed demo.SpO2" }
          Write-Host "upgrade and uninstall clean"

      - name: Smoke Test the Installer (silent install, run, uninstall)
        shell: pwsh
        run: |
          $setup = "installer\fiedle400-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer was not produced" }

          # /VERYSILENT needs no UAC: the script installs per-user into LOCALAPPDATA.
          Start-Process -FilePath $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait

          $installed = "$env:LOCALAPPDATA\Programs\fiedle400\fiedle400.exe"
          if (-not (Test-Path $installed)) { throw "fiedle400.exe was not installed to $installed" }

          # The shortcut's WorkingDir must exist, or Explorer silently falls back.
          $datadir = [Environment]::GetFolderPath("MyDocuments") + "\fiedle400"
          if (-not (Test-Path $datadir)) { throw "data folder was not created at $datadir" }

          # The installed binary must actually run, not merely exist.
          $out = & $installed --version
          Write-Host "installed binary reports: $out"
          if ($out -notmatch "${{ steps.ver.outputs.version }}") {
            throw "version mismatch: expected ${{ steps.ver.outputs.version }}, got '$out'"
          }
          & $installed --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help exited $LASTEXITCODE" }

          # Leave the runner clean so a rerun starts from nothing.
          $uninst = Get-ChildItem "$env:LOCALAPPDATA\Programs\fiedle400" -Filter "unins*.exe" | Select-Object -First 1
          if ($uninst) {
            Start-Process -FilePath $uninst.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: fiedle400-setup.exe
          path: installer/fiedle400-setup.exe

  release:
    name: Create GitHub Release
    needs: [build, installer-windows, quarantine-macos, linux-oldest-lts]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    # The repo's default Actions token is read-only (confirmed via
    # `gh api repos/.../actions/permissions/workflow`), so creating a release
    # 403s without this. Scoped to just this job/permission rather than
    # flipping the repo-wide default, which would grant write to every job.
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*/*
          draft: false
          # Beta (RELEASE_PLAN.md 3f): G7 (a real finger-on-probe session,
          # plot confirmed physiologically plausible) passed -- first
          # 2026-10-15, re-confirmed repeatedly since, including a 190-record
          # real download/plot on 2026-10-16. Promoted from alpha 2026-10-16
          # (psytrap); no version bump needed for the promotion itself.
          prerelease: false
          body: |
            ### Pulsox PO-400 Standalone Executables & Installers

            **Beta release.** All automated gates pass, and a real-world
            finger-on-probe session has been recorded and visually confirmed
            (RELEASE_PLAN.md gate G7): SpO2 and heart-rate traces show real
            physiological variation, not flat-lined or implausible values.
            Promoted from alpha to beta 2026-10-16.

            **Windows SmartScreen:** these binaries are not code-signed, so Windows
            will show a "Windows protected your PC" warning. Choose *More info* →
            *Run anyway*. Verify the SHA-256 against the CI artifacts if in doubt.

            **Minimum Windows:** verified on Windows 8.1 (6.3.9600, x64) with a real
            PO-400 attached. Newer versions work; older ones are untested.

            **Device clock:** the PO-400 does not report its clock over USB (it answers
            with the same fixed bytes every time), so `read-time` shows that reply raw and
            `set-time` is unverified. Stored sessions keep their correct timestamps regardless.
            
            - **Windows (installer)**: Download `fiedle400-setup.exe` -- installs per-user, no admin rights needed.
            - **Windows (portable)**: Download `fiedle400-windows-x64.exe` (run directly from PowerShell or CMD).
            - **Linux**: Download `fiedle400-linux-x64.tar.gz`, extract it, then `./install.sh`
              (installs `fiedle400` to `~/.local/bin`). Device access needs a one-time root step:
              `sudo ./fiedle400_setup-udev.sh`. Then verify with `fiedle400 selftest`.
            - **macOS**: Download `fiedle400-macos-arm64` (Apple Silicon M1/M2/M3/M4). It is unsigned:
              run `chmod +x fiedle400-macos-arm64` and `xattr -d com.apple.quarantine fiedle400-macos-arm64` once.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
